name: Main source branch

# Releases reach main only from dev. This check passes when a pull request
# into main comes from dev and fails for any other source branch.

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  source-branch:
    name: Source branch is dev
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests into main must come from the dev branch of $BASE_REPO, not from $HEAD_REPO."
            exit 1
          fi
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Pull requests into main must come from dev. This one comes from '$HEAD_REF'. Merge it into dev instead."
            exit 1
          fi
          echo "Source branch is dev."
